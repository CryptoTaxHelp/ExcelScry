name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Only `release` writes to the repository, and it asks for that permission
# itself. Everything else runs read-only: the installer is uploaded as a
# workflow artifact, not as a release asset.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests, lints, formatting and version bookkeeping. ExcelScry is Windows-only
  # — the shell integration is built on winreg and windows-sys — so the checks
  # run on Windows rather than on a cheaper Linux runner that could not build it.
  checks:
    name: Tests, clippy, formatting and version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust, with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      # --locked makes the committed Cargo.lock part of the contract: CI fails
      # if a dependency change was never written back to it.
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The version is repeated in four files. A bump that misses one mislabels
      # the installer rather than failing, so check them here, on every push.
      - name: Check that the version copies agree
        run: python scripts/bump_version.py --check

      # The key roll a release publishes is decided by
      # `src-tauri/updater-keys.json`. It is written into the manifest by the
      # release job, after this, so a roll no installed copy could carry out is
      # caught here - on a pull request - rather than on a tag.
      - name: Check that the updater key roll can be carried out
        run: python scripts/manifest_keys.py --check

      # The manifest a release publishes names each asset by the file the release
      # page serves it as, which is a rewrite of what `tauri-action` writes. It
      # happens on a tag, after this job, so what the rewrite refuses - an asset
      # id the release does not list, an asset from another repository - is
      # checked here rather than on the release that would publish it.
      - name: Check that the manifest names its assets by file name
        run: python scripts/test_manifest_urls.py

      # The release job reads the signing key before it builds, so a missing or
      # wrong key costs a second rather than a compile. What that check accepts
      # and refuses is what keeps it from being another way to lose a release.
      - name: Check that the signing key preflight accepts and refuses the right keys
        run: python scripts/test_signing_key.py

      # `release.py` cuts a release of *this* repository, so it can never be
      # exercised on this one. The test runs it in a throwaway repository
      # instead - the real `src-tauri/` and `scripts/` copied in, a changelog
      # with something in `Unreleased`, and a bare remote to push to - and
      # checks every refusal the flow is supposed to make, and the release it is
      # supposed to make. What runs is the code in this checkout, so a change
      # that breaks the release flow fails here rather than on a tag.
      - name: Check that the release flow does what it says it does
        run: python scripts/test_release.py

      # A release has to be invisible until its manifest is signed, which the
      # release job does by building a draft and publishing it last - after the
      # signature has been read back out and checked. That is an ordering in a
      # file this job never runs, and the release job's own verification passes
      # whether or not a step was moved, so the ordering is read out here on
      # every push instead. PyYAML is not part of the runner's Python, so it is
      # installed rather than assumed: a check that quietly skipped itself would
      # be worse than none.
      - name: Check that no release can be published before its manifest is signed
        run: |
          python -m pip install --quiet pyyaml
          python scripts/verify_workflow.py

  # The release flow's test is worth what it catches, and a test that has stopped
  # catching something goes on passing - including on the commit that breaks the
  # flow. This breaks `release.py` one deliberate way at a time and requires the
  # test to fail for the mutation it claims. It takes minutes rather than
  # seconds, which is why it is a job of its own rather than a step in `checks`,
  # and it is skipped for a tag, whose branch push has already been through it.
  mutants:
    name: Release flow mutation check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # One of the checks a release runs is `cargo metadata --locked`, so the
      # toolchain has to be here. Nothing is compiled, but this is the same
      # workspace and key the other jobs cache under, and what it brings with it
      # is the registry index `cargo metadata` would otherwise fetch.
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Every mutation is applied to a copy of the checkout that a worker makes
      # for itself, never to the files this job runs from, so a run cannot leave
      # a mutated release.py behind for a person debugging it later.
      - name: Check that breaking the release flow breaks its test
        run: python scripts/mutate_release.py

  # The portable executable and the NSIS installer, built the same way
  # scripts/build.sh builds them locally. No tagName/releaseId is passed, so
  # nothing is published; the bundles are uploaded as a workflow artifact.
  # Skipped for a tag, which the release job below builds once.
  installer:
    name: Windows installer
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Exactly the preflight the release job runs, and first for the same
      # reason: nothing here is worth installing or compiling until the key is
      # known to be one this build can sign with. A secret that is not set
      # arrives at the bundler as an *empty* variable rather than an absent one,
      # which its own "no private key" complaint does not cover, so the failure
      # would come minutes later as an exit 1 that blames the password and never
      # mentions a secret. A secret holding another key's material is worse: it
      # builds and signs perfectly, and every installed copy refuses the result.
      # `verify_signing_key.py` settles both against the pubkey committed in
      # `tauri.conf.json`.
      - name: Check that the updater signing key is the one this build trusts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/verify_signing_key.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # No Node or npm setup is needed: the front end is plain HTML/CSS/JS that
      # `frontendDist` points straight at, and there is no beforeBuildCommand.
      #
      # No NSIS install step either: tauri-bundler fetches and hash-verifies
      # its own toolset (NSIS_URL in tauri-bundler's windows/nsis module).
      #
      # It does need the signing key, because `createUpdaterArtifacts` is on and
      # every `tauri build` signs its updater artifact; the step above settles
      # that key before the build rather than inside it.
      - name: Build the app and the installer
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          uploadWorkflowArtifacts: true
          # The portable executable is a first-class deliverable, so the
          # artifact carries it alongside the installer's bundles.
          uploadPlainBinary: true
          # Nothing is released, so the updater files have nowhere to go.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  # Pushing a v* tag builds the release, and publishes it once its manifest is
  # signed: everything is attached while the release is a draft, and the last
  # step makes it visible. This is the only job that writes to the repository,
  # and it refuses to publish a tag that disagrees with the manifests, so a
  # mislabelled release cannot get out.
  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `release_notes.py` reads the commit history since the previous tag,
          # so the clone needs all of it — depth 0 fetches every branch and tag.
          fetch-depth: 0

      # Before anything is installed or built. `createUpdaterArtifacts` is on, so
      # every `tauri build` signs its updater artifact: without the key the build
      # fails after compiling the whole app, as an exit 1 from `tauri build` that
      # says nothing about a secret. A workflow cannot test a secret in a step's
      # `if:`, so this is a step that reads the environment and fails on its
      # first line. It also holds the key to the `pubkey` committed in
      # `tauri.conf.json`, because a secret holding another key builds and signs
      # perfectly and is then refused by every installed copy.
      - name: Check that the updater signing key is the one this build trusts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/verify_signing_key.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check that the tag names the version
        run: python scripts/bump_version.py --check --tag "${{ github.ref_name }}"

      - name: Build the release notes
        id: notes
        shell: bash
        run: |
          python scripts/release_notes.py --out release-notes.md
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the release, as a draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifact. The matching public key is committed in
          # tauri.conf.json; without this secret the build fails rather than
          # publishing something the updater would refuse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: ExcelScry ${{ github.ref_name }}
          # Our curated changelog entry and commit list, with GitHub's own
          # generated notes appended after it.
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          # Nothing is served while the manifest is unsigned. The endpoint the
          # app asks - `.../releases/latest/download/latest.json` - resolves to
          # the latest release that is neither a draft nor a pre-release, so
          # while this release is a draft that endpoint still answers with the
          # previous release's signed manifest. The last step of this job
          # publishes this one, once `latest.json.sig` is attached and checked,
          # which is the first moment a copy can see any of it. A build that
          # fails before then leaves a draft no copy can see, rather than a
          # public release nobody could update from.
          releaseDraft: true
          # Both deliverables reach the release page: the portable executable
          # and the NSIS installer.
          uploadPlainBinary: true
          # The manifest the app updates from - `latest.json`, the asset the
          # updater endpoint resolves - plus the .sig it embeds.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      # `tauri-action` cannot sign the manifest: it writes `latest.json` after
      # the build, and what the app now checks is a signature over the manifest
      # itself, so that the version the endpoint announces is signed rather than
      # merely carried over TLS. So it is signed here, with the same key as the
      # installers, and published beside the manifest as `latest.json.sig` -
      # which is where the app looks for it, and where the key roll has to be by
      # then too. An installed copy refuses a release whose manifest carries no
      # signature, so this has to succeed for the release to be updateable at
      # all; the `verify-release` job below checks the published result rather
      # than trusting this step. It runs while the release is a draft, so a
      # failure here leaves nothing public rather than an unsigned manifest at
      # the endpoint.
      - name: Sign the update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same secret the build uses: the CLI reads the key from here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated with no password, so this is normally empty.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p updater-manifest
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir updater-manifest
          # The Tauri CLI ships as a prebuilt npm binary, and tauri-action
          # installs it on this runner the same way; installing it here as well
          # means this step does not depend on what that action left behind.
          npm install --global @tauri-apps/cli@v2
          # The updater key roll goes in first: an installed copy takes a new
          # key, and the retirement of an old one, from this manifest and
          # nowhere else, so it has to be part of what the signature below
          # covers. The roll is `src-tauri/updater-keys.json`, which the checks
          # job has already held to the rules the app applies to one.
          python scripts/manifest_keys.py updater-manifest/latest.json
          # Then the assets are named the way the release page serves them.
          # `tauri-action` writes each platform's url as the release API's
          # `.../releases/assets/<id>`, which the updater can fetch and nothing
          # else can, and which `<id>.sig` cannot name a signature from. The
          # names come from the release itself, so the url written is the one
          # GitHub already serves that asset at. This is before the signature
          # like the key roll is: an installed copy verifies the bytes it
          # downloads, so what it verifies has to be this manifest.
          python scripts/manifest_urls.py updater-manifest/latest.json \
            --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"
          # The version comes from the manifest, never a literal: it is the
          # number the tag was checked against and the one `tauri build` stamps
          # into the installers' signatures, so the three agree by construction.
          tauri signer sign \
            --app-version "$(python scripts/bump_version.py --print)" \
            updater-manifest/latest.json
          # The rewritten manifest is uploaded with its signature, not just the
          # signature: the draft still carries the manifest tauri-action wrote,
          # whose asset urls are the API's. Leaving those bytes attached would
          # publish a manifest the signature above does not cover.
          gh release upload "${{ github.ref_name }}" \
            updater-manifest/latest.json updater-manifest/latest.json.sig --clobber

      # The release becomes visible here and nowhere else. Every asset it will
      # serve is already attached - the installer, its signature, `latest.json`
      # with the key roll in it, and `latest.json.sig` beside it - and the two
      # manifest files are read back out of the draft and checked before the
      # release is published, so what a copy can reach, from the first moment it
      # can reach anything, is a manifest that is signed. The check stops before
      # the artifacts: a draft's assets are not public, which is the point of
      # publishing last, so `verify_release.py` is asked for the manifest alone.
      - name: Publish the signed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p signed-manifest
          # Both files, so a manifest that was signed but whose signature did
          # not upload is caught here rather than at the endpoint.
          gh release download "${{ github.ref_name }}" --pattern 'latest.json*' --dir signed-manifest
          python scripts/verify_release.py \
            --manifest signed-manifest/latest.json --signature-only
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          echo "Published ${{ github.ref_name }}: a copy asking the endpoint now"
          echo "gets this release's manifest, signed, or the previous one's."

  # Publishing the files and being updateable from them are different questions,
  # and this job asks the second one. It runs only after `release` has succeeded
  # - a skipped or failed release job skips this job with it - and then asks the
  # endpoint the app asks what an installed copy would get, checking every asset
  # the release publishes: the manifest, the signature published beside it, the
  # key roll it carries, the installer the manifest points at, the signature
  # published beside that, and the portable executable. A manifest that 404s,
  # that is not signed, whose signature does not cover it, that names another
  # version, that publishes a key roll this repository does not, an installer
  # that does not match the signature it carries, a `.sig` that disagrees with
  # the one the manifest embeds, or a portable build left behind by an earlier
  # release is reported on the run for the tag, rather than in someone's status
  # bar.
  #
  # It needs no token: a published release's assets are public, and the key it
  # verifies against is the one committed in `tauri.conf.json`.
  verify-release:
    name: Verify the published release
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every asset the published release carries
        run: python scripts/verify_release.py "${{ github.ref_name }}"

      # The check above downloads what the manifest names, which the updater
      # can do through the API urls `tauri-action` writes. This asks the other
      # half of the question: that what a copy reaches names its assets the way
      # the release page does, so a tool reading the manifest - a person with
      # `curl`, a page, a script - gets the file rather than its metadata. It
      # runs after the check above, which is what establishes that the endpoint
      # is serving this release rather than the previous one.
      - name: Check the manifest names its assets by file name
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manifest_urls.py --check \
            --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"
