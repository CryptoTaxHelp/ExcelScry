[package]
name = "ExcelScry"
version = "0.5.0"
description = "ExcelScry - a fast Excel and OpenDocument spreadsheet viewer"
authors = ["ExcelScry"]
edition = "2021"
# tauri-plugin-updater requires 1.90; the number here is what a contributor's
# toolchain has to satisfy, so it has to cover every dependency.
rust-version = "1.90"
license = "MIT"
default-run = "ExcelScry"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = { version = "0.36.1", features = ["dates"] }
# A cell's number format (currency, percentage, dd/mm/yyyy...) decides how the
# sheet shows it. calamine exposes values only, so the format codes are read
# from the package and rendered here; `ssfmt` implements Excel's format-code
# grammar, including its sections, bracket currency and date tokens.
ssfmt = "0.1.2"
# Decoding a delimited file in the encoding it is read with. Already in the tree
# through reqwest, so this adds no compiled code; a CSV from a Windows tool is
# Windows-1252 far more often than it is valid UTF-8.
encoding_rs = "0.8"
# Working out which legacy encoding a file that is not UTF-8 is in. A file's
# bytes are all that say this, and the answer decides every character in the
# grid: Windows-1252 read as Shift_JIS is a wall of mojibake. `chardetng` is
# the detector Firefox uses, and it names the Japanese, Chinese and Korean
# encodings and the single-byte code pages rather than only the Western one.
# It depends on `encoding_rs`, `memchr` and `cfg-if`, all already in the tree.
chardetng = "1.0"
# Already in the tree via calamine; used directly to read the style parts of a
# package, which calamine does not expose.
quick-xml = "0.41"
spreadsheet-ods = "1.0.4"
# Already in the tree via calamine; used directly to list a package's parts.
zip = "8.6.0"
# Default features are off on purpose: the `zip` feature pulls in `zip ^4`, and
# every published 4.x of that crate is yanked, so the resolver cannot pick one.
# It is only needed to unpack a zipped updater payload (the legacy
# `nsis.zip`/AppImage-tarball formats); this app publishes the NSIS setup.exe,
# which the updater runs directly.
# The update manifest is signed as well as the installer it points at, and the
# app checks that signature itself before it believes anything the manifest
# says. All four crates below are already in the tree through
# tauri-plugin-updater - they are listed here because this crate now uses them
# directly, and their versions and features match the plugin's so that the
# compiled set of crates does not change.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Verifying the signature over the manifest, and its public key.
minisign-verify = "0.3"
base64 = "0.22"
# Fetching the manifest and its signature. The updater links rustls without a
# provider and installs one on the way into its own first request; this crate
# makes a request of its own, so it installs the same one.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
tauri-plugin-single-instance = "2.5.4"
# For SHChangeNotify, so Explorer refreshes its context menu immediately, and
# for ShellExecuteW, which opens a link from the release notes in the user's own
# browser. (`Win32_UI_Shell` does not pull in the module `ShellExecuteW`'s
# signature mentions, hence the second feature.)
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
