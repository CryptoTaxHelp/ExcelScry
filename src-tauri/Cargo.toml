[package]
name = "ExcelScry"
version = "0.1.0"
description = "ExcelScry - a fast XLS / XLSX viewer with ODS export"
authors = ["ExcelScry"]
edition = "2021"
# tauri-plugin-updater requires 1.90; the number here is what a contributor's
# toolchain has to satisfy, so it has to cover every dependency.
rust-version = "1.90"
license = "MIT"
default-run = "ExcelScry"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = { version = "0.36.1", features = ["dates"] }
spreadsheet-ods = "1.0.4"
# Already in the tree via calamine; used directly to list a package's parts.
zip = "8.6.0"
# Default features are off on purpose: the `zip` feature pulls in `zip ^4`, and
# every published 4.x of that crate is yanked, so the resolver cannot pick one.
# It is only needed to unpack a zipped updater payload (the legacy
# `nsis.zip`/AppImage-tarball formats); this app publishes the NSIS setup.exe,
# which the updater runs directly.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
tauri-plugin-single-instance = "2.5.4"
# Only for SHChangeNotify, so Explorer refreshes its context menu immediately.
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
